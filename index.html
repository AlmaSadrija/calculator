<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <span>
      <button class="dark-mode">🌙</button>
    </span>
    <div class="container">
      <div class="operation-display"></div>
      <div class="display">0</div>
      <div class="history">
        <h3>History</h3>
        <ul class="history-list"></ul>
      </div>

      <button data-clear>C</button>
      <button data-special="+/-">+/-</button>
      <button data-special="%">%</button>
      <button data-operator="/">/</button>
      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button data-operator="*">×</button>
      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button data-operator="-">-</button>
      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button data-operator="+">+</button>
      <button data-special="emoji">🧮</button>
      <button data-clearing="emoji">🪣</button>
      <button data-number="0">0</button>
      <button data-number=".">.</button>
      <button data-equal="=">=</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
